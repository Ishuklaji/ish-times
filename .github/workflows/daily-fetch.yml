name: Daily fetch

on:
  schedule:
    # 04:00 UTC = 05:00/06:00 Europe/Berlin, so the edition is ready before Ish wakes up.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run daily fetch
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: npm run fetch:daily

      - name: Commit and push updated content
        run: |
          git config user.name "ish-times-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/current.json data/run-log.json data/used-items.json
          if git diff --cached --quiet; then
            echo "No content changes to commit."
          else
            git commit -m "Daily content refresh: $(date -u +%Y-%m-%d)"
            git push
          fi
